syntax = "proto3";

package meshtastic;

message LoBBSWallCanvas {
  string cells = 1;
  uint32 crc32 = 2;
}

message LoBBSWallSeen {
  uint64 user_uuid = 1;
  uint32 last_crc32 = 2;
}

message LoBBSWallConfig {
  uint32 period_seconds = 1;
  uint32 max_cells_per_cycle = 2;
}

message LoBBSWallQuota {
  uint64 user_uuid = 1;
  uint32 cycle_start = 2;
  uint32 cells_used = 3;
}
